; Gemini TTS via Apps Script helper — paste into extensions_custom.conf (FreePBX/Issabel)
; or include from extensions.conf, then: asterisk -rx "dialplan reload"
;
; Prereqs:
;   - deploy/asterisk/Code.gs published as Web app (Anyone) → /exec URL
;   - sudo bash deploy/asterisk/install_on_asterisk.sh
;   - /etc/asterisk/gemini_tts.env with GOOGLE_APPS_SCRIPT_URL=...
;
; Test: dial the extension you map to this context (or call Goto(gemini-tts-demo,s,1))

[gemini-tts-demo]
exten => s,1,NoOp(Gemini TTS demo)
 same => n,Answer()
 same => n,System(. /etc/asterisk/gemini_tts.env; /usr/bin/python3 /usr/local/bin/gemini_tts.py --text "سلام، خوش آمدید" --out /var/lib/asterisk/sounds/custom/gemini_tts.wav)
 same => n,Playback(custom/gemini_tts)
 same => n,Hangup()

; Example: from-internal feature code *555
;[*555]
;exten => s,1,Goto(gemini-tts-demo,s,1)
